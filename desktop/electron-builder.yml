appId: dev.yttools.desktop
productName: YT Tools
copyright: Copyright (c) 2026 Thomas Hendrickx

directories:
  output: dist
  buildResources: build

# Only the shell itself; everything else arrives through extraResources.
files:
  - main.js
  - package.json

extraResources:
  - from: resources
    to: .

# Prunes the Chromium locale bundles and SwiftShader from inside the Electron
# framework, which electron-builder's own electronLanguages does not reach.
afterPack: scripts/after-pack.cjs

mac:
  category: public.app-category.utilities
  icon: build/icon.icns
  darkModeSupport: true
  target:
    - target: dmg
      arch: [arm64]
  # No Apple Developer ID here, so the build is unsigned. Hardened runtime is
  # off deliberately: with an ad-hoc signature it blocks the bundled Python and
  # ffmpeg from loading. Users must clear the quarantine flag once — see
  # docs/DESKTOP.md. Set an identity and flip these on if you have a cert.
  identity: null
  hardenedRuntime: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSHumanReadableCopyright: >-
      Bundles yt-dlp (Unlicense) and FFmpeg (LGPL 2.1). See Resources/bin/ffmpeg.LICENSE.

dmg:
  title: YT Tools
  # LZFSE compresses the image noticeably better than the default zlib.
  format: ULFO
  contents:
    - x: 140
      y: 190
      type: file
    - x: 400
      y: 190
      type: link
      path: /Applications
