name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded pull-request runs, but let every commit that lands on a
# branch finish its build — otherwise a quick follow-up push silently cancels
# the Docker job for the commit before it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: yttools:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The point of this image is that yt-dlp and ffmpeg are inside it.
      # Building successfully proves nothing; asking the running container
      # whether it can find them does.
      - name: Smoke test
        run: |
          docker run -d --name yttools -p 3000:3000 yttools:ci
          for _ in $(seq 1 30); do
            curl -sf http://localhost:3000/api/health >/dev/null && break
            sleep 2
          done
          echo "--- /api/health ---"
          curl -sf http://localhost:3000/api/health | tee health.json
          echo
          jq -e '.ytDlp.available and .ffmpeg.available' health.json

          echo "--- rejects a non-YouTube URL ---"
          curl -s -o body.json -w '%{http_code}' \
            -X POST http://localhost:3000/api/info \
            -H 'Content-Type: application/json' \
            -d '{"url":"https://evil.example.com/watch?v=abc"}' | grep -q '^400$'
          jq -e '.error.code == "INVALID_URL"' body.json

      # The release workflow publishes linux/amd64 *and* linux/arm64, but this
      # job only ever built the runner's own architecture — which is how an
      # x86_64-only yt-dlp binary reached a tag before anything noticed.
      # Emulated, so build only: running it under QEMU is slow and flaky.
      - name: Build for linux/arm64 as well
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container logs
        if: always()
        run: docker logs yttools || true

      - name: Tear down
        if: always()
        run: docker rm -f yttools || true
