name: Desktop (macOS)

# Manual only. It downloads Electron, a CPython runtime, yt-dlp and ffmpeg,
# then produces a ~400 MB app — not something to run on every push.
on:
  workflow_dispatch:
    inputs:
      attach_to_release:
        description: "Tag to attach the DMG to (leave empty to just upload an artifact)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  dmg:
    name: Build DMG
    runs-on: macos-14 # Apple Silicon

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Build the DMG
        working-directory: desktop
        run: npm run dist

      - name: Verify the bundle carries its runtimes
        working-directory: desktop
        run: |
          APP="dist/mac-arm64/YT Tools.app/Contents/Resources"
          test -x "$APP/bin/ffmpeg"            || { echo "ffmpeg missing"; exit 1; }
          test -f "$APP/bin/yt-dlp.pyz"        || { echo "yt-dlp missing"; exit 1; }
          test -x "$APP/python/bin/python3"    || { echo "python missing"; exit 1; }
          test -f "$APP/server/server.js"      || { echo "server missing"; exit 1; }
          test -f "$APP/bin/ffmpeg.LICENSE"    || { echo "ffmpeg licence missing"; exit 1; }
          echo "bundle contents verified"
          ls -lh dist/*.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: yttools-macos-arm64
          path: desktop/dist/*.dmg
          retention-days: 14

      - name: Attach to release
        if: inputs.attach_to_release != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.attach_to_release }}" desktop/dist/*.dmg --clobber
