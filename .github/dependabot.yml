version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # archiver 8 is a class-based ESM rewrite with no published types, while
      # @types/archiver still describes the v6/v7 factory API. Upgrading passes
      # typecheck and then throws "archiver is not a function" at runtime — in
      # the playlist ZIP path, which unit tests cannot reach because it needs
      # yt-dlp and a live YouTube request. Revisit when archiver ships types.
      - dependency-name: archiver
        update-types: ["version-update:semver-major"]

    groups:
      # Next, React and their types move together; separate PRs just conflict.
      next:
        patterns: ["next", "react", "react-dom", "@types/react", "@types/react-dom"]
      dev-tooling:
        patterns: ["eslint*", "prettier", "vitest", "@vitest/*", "typescript"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  # yt-dlp is pinned in the Dockerfile rather than here — see README. Dependabot
  # still watches the Node base image.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
